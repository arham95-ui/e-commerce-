{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login - E-Shop{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0" style="border-radius: 20px;">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="bg-primary rounded-circle d-inline-flex align-items-center justify-content-center" 
                             style="width: 80px; height: 80px;">
                            <i class="fas fa-user-circle fa-3x text-white"></i>
                        </div>
                        <h2 class="mt-3">Welcome Back!</h2>
                        <p class="text-muted">Login to your account</p>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-primary w-100 py-3 mt-3" 
                                style="border-radius: 10px; font-weight: 600;">
                            <i class="fas fa-sign-in-alt me-2"></i>Login
                        </button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="mb-2">
                            <a href="{% url 'accounts:password_reset' %}" class="text-decoration-none">
                                Forgot Password?
                            </a>
                        </p>
                        <p class="mb-0">Don't have an account? 
                            <a href="{% url 'accounts:register' %}" class="text-decoration-none fw-bold text-primary">
                                Register
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
